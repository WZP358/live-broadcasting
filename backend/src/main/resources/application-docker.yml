server:
  port: ${SERVER_PORT:8088}

spring:
  datasource:
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    url: ${DB_URL:jdbc:mysql://localhost:3306/ant-live?characterEncoding=utf-8&serverTimezone=GMT%2b8}
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      max-wait: ${DB_DRUID_MAX_WAIT:60000}
      initial-size: ${DB_DRUID_INITIAL_SIZE:5}
      min-idle: ${DB_DRUID_MIN_IDLE:5}
      max-active: ${DB_DRUID_MAX_ACTIVE:20}

  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: ${MAIL_ENCODING:UTF-8}
    port: ${MAIL_PORT:465}
    protocol: ${MAIL_PROTOCOL:smtps}

  redis:
    database: ${REDIS_DATABASE:0}
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    jedis:
      pool:
        max-active: ${REDIS_POOL_MAX_ACTIVE:8}
        max-idle: ${REDIS_POOL_MAX_IDLE:8}
    timeout: ${REDIS_TIMEOUT:5000}

  servlet:
    multipart:
      enabled: true
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:4096MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:4096MB}

tencent:
  sms:
    appid: ${TENCENT_SMS_APPID:}
    appKey: ${TENCENT_SMS_APP_KEY:}
    templateId: ${TENCENT_SMS_TEMPLATE_ID:}
    templateNoticeId: ${TENCENT_SMS_TEMPLATE_NOTICE_ID:}
    smsSign: ${TENCENT_SMS_SIGN:}
  cos:
    bucketName: ${TENCENT_COS_BUCKET_NAME:}
    path: ${TENCENT_COS_PATH:}

mybatis-plus:
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-not-delete-value: 0
      logic-delete-value: 1

alipay:
  path: ${ALIPAY_STATIC_PATH:}

minio:
  endpoint: ${MINIO_ENDPOINT:}
  ip: ${MINIO_IP:}
  port: ${MINIO_PORT:9000}
  accessKey: ${MINIO_ACCESS_KEY:}
  secretKey: ${MINIO_SECRET_KEY:}
  bucketName: ${MINIO_BUCKET_NAME:live.file.bucket}

dromara:
  x-file-storage:
    default-platform: ${FILE_STORAGE_DEFAULT_PLATFORM:minio-1}
    thumbnail-suffix: ${FILE_STORAGE_THUMBNAIL_SUFFIX:.min.jpg}
    minio:
      - platform: minio-1
        enable-storage: ${FILE_STORAGE_MINIO_ENABLED:false}
        access-key: ${MINIO_ACCESS_KEY:}
        secret-key: ${MINIO_SECRET_KEY:}
        end-point: ${MINIO_ENDPOINT:}
        bucket-name: ${MINIO_BUCKET_NAME:live.file.bucket}
        domain: ${MINIO_DOMAIN:http://localhost:9000/live.file.bucket/}
        base-path: ${MINIO_BASE_PATH:}
