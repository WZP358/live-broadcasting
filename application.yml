minio:
  endpoint: http://localhost:9000
  ip: localhost
  port: 9000
  accessKey: minioadmin
  secretKey: minioadmin
  bucketName: live.file.bucket

guard:
  enabled: true
  endpoint: http://localhost:8000/check
  intervalSeconds: 2

dromara:
  x-file-storage:
    default-platform: minio-1 # 默认使用的存储平台
    thumbnail-suffix: ".min.jpg" # 缩略图后缀
    minio:
      - platform: minio-1
        enable-storage: true
        access-key: minioadmin
        secret-key: minioadmin
        end-point: http://localhost:9000
        bucket-name: live.file.bucket
        domain: http://localhost:9000/live.file.bucket/ # 访问域名，注意“/”结尾，例如：http://minio.abc.com/abc/
        base-path:  # 基础路径 xx/
